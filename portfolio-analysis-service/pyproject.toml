[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-analysis-service"
version = "0.1.0"
description = "Locally hosted portfolio analysis API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]>=0.29",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "SIM", "RUF", "D"]
ignore = ["B008", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/steps/*.py" = ["E501"]
"tests/unit/*.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_steps.py"]
bdd_features_base_dir = "tests/features"
markers = [
    "us1: User Story 1 scenarios",
    "us2: User Story 2 scenarios",
    "us3: User Story 3 scenarios",
    "us4: User Story 4 scenarios",
    "validation: Validation edge-case scenarios",
]
